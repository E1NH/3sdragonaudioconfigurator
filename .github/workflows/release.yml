name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DragonOS.AudioConfigurator.sln --runtime win-x64

      - name: Publish
        run: |
          dotnet publish src/WPF/DragonOS.AudioConfigurator.WPF.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -o publish/

      - name: Zip
        run: Compress-Archive -Path publish/* -DestinationPath DragonOS.AudioConfigurator.zip

      - name: Generate SHA-256
        run: |
          $hash = (Get-FileHash DragonOS.AudioConfigurator.zip -Algorithm SHA256).Hash
          "SHA-256: $hash  DragonOS.AudioConfigurator.zip" | Out-File -FilePath sha256.txt -Encoding utf8
          echo "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DragonOS.AudioConfigurator.zip
            sha256.txt
          generate_release_notes: true
          body: |
            ## SHA-256 Checksum
            ```
            ${{ env.SHA256 }}  DragonOS.AudioConfigurator.zip
            ```
            Verify before running: `Get-FileHash DragonOS.AudioConfigurator.zip -Algorithm SHA256`
